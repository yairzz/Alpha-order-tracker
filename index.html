    const MOCK_ORDERS = [
      {

        isArchived: false,

      },
      {

        orderNumber: 'PO-2024-002',
        trackingNumber: '',
        quantity: 5,
        project: 'פרויקט אוטומציה',
        requestedBy: 'משה כהן',
        url: 'https://www.siemens.com',
        status: 'הוזמנה',
        notes: 'ספק מתחייב לאספקה תוך 14 ימי עסקים.',
        isArchived: false,
        date: new Date(Date.now() - 86400000).toISOString(),
        createdAt: Date.now() - 86400000
      }
    ];

    // ===== Authentication (Firebase Auth, Email/Password) =====
    // Users type a short username; it's mapped to an email in this domain.
    // Create users in Firebase Console as: <username>@alpha-order-tracker.firebaseapp.com
    const USERNAME_EMAIL_DOMAIN = 'alpha-order-tracker.firebaseapp.com';

    const usernameToEmail = (username) => {
      const u = username.trim().toLowerCase();
      return u.includes('@') ? u : `${u}@${USERNAME_EMAIL_DOMAIN}`;
    };

    // Admin = whoever's UID is listed here. The same UID is enforced in Firestore Rules (see SPEC.md).
    const ADMIN_UIDS = ['sMoVn9wwO9dZx2vMuQXf2AJRBNs2'];
    const isAdminUid = (uid) => ADMIN_UIDS.includes(uid);

    const MIN_PASSWORD_LENGTH = 8;
    const USERNAME_PATTERN = /^[a-z0-9._-]{2,30}$/;

    const emailToUsername = (email) => {
      if (!email) return '';
      const suffix = '@' + USERNAME_EMAIL_DOMAIN;
      return email.endsWith(suffix) ? email.slice(0, -suffix.length) : email;
    };

    const getActiveFirebaseConfig = () => {
      const savedConfig = localStorage.getItem('user_firebase_config');
      if (savedConfig) {
        try { return JSON.parse(savedConfig); } catch (e) {}
      }
      return DEFAULT_FIREBASE_CONFIG;
    };

    const initFirebaseApp = () => {
      if (!firebase.apps.length) {
        firebase.initializeApp(getActiveFirebaseConfig());
      }
      return firebase.app();
    };

    const AUTH_ERRORS = {
      'auth/invalid-credential': 'שם משתמש או סיסמה שגויים.',
      'auth/invalid-login-credentials': 'שם משתמש או סיסמה שגויים.',
      'auth/wrong-password': 'שם משתמש או סיסמה שגויים.',
      'auth/user-not-found': 'שם משתמש או סיסמה שגויים.',
      'auth/invalid-email': 'שם המשתמש אינו תקין.',
      'auth/user-disabled': 'המשתמש הושבת. פנה למנהל המערכת.',
      'auth/too-many-requests': 'יותר מדי ניסיונות כושלים. נסה שוב בעוד מספר דקות.',
      'auth/network-request-failed': 'אין חיבור לרשת. בדוק את החיבור ונסה שוב.',
      'auth/operation-not-allowed': 'התחברות בשם משתמש וסיסמה אינה מופעלת ב-Firebase.',
      'auth/configuration-not-found': 'שירות ההתחברות (Authentication) עדיין לא הופעל ב-Firebase. פנה למנהל המערכת.'
    };

    function LoginScreen({ initError }) {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState(initError || '');
      const [busy, setBusy] = useState(false);

      const handleLogin = async (e) => {
        e.preventDefault();
        if (!username.trim() || !password) return;
        setBusy(true);
        setError('');
        try {
          await firebase.auth().signInWithEmailAndPassword(usernameToEmail(username), password);
        } catch (err) {
          console.error('Login failed:', err);
          setError(AUTH_ERRORS[err.code] || 'ההתחברות נכשלה. נסה שוב.');
          setBusy(false);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center bg-slate-50 p-4" dir="rtl">
          <div className="bg-white w-full max-w-sm rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
            <div className="px-6 pt-8 pb-4 flex flex-col items-center gap-3">
              <div className="bg-blue-600 p-3 rounded-xl text-white shadow-md shadow-blue-500/20">
                <IconClipboardList />
              </div>
              <h1 className="text-xl font-bold text-slate-900">מערכת מעקב הזמנות</h1>
              <p className="text-sm text-slate-500">יש להתחבר כדי להמשיך</p>
            </div>
            <form onSubmit={handleLogin} className="px-6 pb-8 flex flex-col gap-4">
              <div>
                <label htmlFor="login-username" className="block text-xs font-bold text-slate-700 mb-1">שם משתמש</label>
                <input
                  id="login-username"
                  type="text" autoComplete="username" autoFocus required
                  value={username} onChange={e => setUsername(e.target.value)}
                  className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm text-left focus:outline-none focus:ring-2 focus:ring-blue-500"
                  dir="ltr"
                />
              </div>
              <div>
                <label htmlFor="login-password" className="block text-xs font-bold text-slate-700 mb-1">סיסמה</label>
                <input
                  id="login-password"
                  type="password" autoComplete="current-password" required
                  value={password} onChange={e => setPassword(e.target.value)}
                  className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm text-left focus:outline-none focus:ring-2 focus:ring-blue-500"
                  dir="ltr"
                />
              </div>
              {error && (
                <div role="alert" className="bg-red-50 text-red-700 border border-red-200 rounded-lg px-3 py-2 text-sm">{error}</div>
              )}
              <button
                type="submit" disabled={busy}
                className="bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white py-2.5 rounded-xl font-bold text-sm shadow-md transition-all"
              >
                {busy ? 'מתחבר...' : 'כניסה'}
              </button>
            </form>
          </div>
        </div>
      );
    }

    const PASSWORD_ERRORS = {
      'auth/invalid-credential': 'הסיסמה הנוכחית שגויה.',
      'auth/invalid-login-credentials': 'הסיסמה הנוכחית שגויה.',
      'auth/wrong-password': 'הסיסמה הנוכחית שגויה.',
      'auth/weak-password': 'הסיסמה החדשה חלשה מדי.',
      'auth/too-many-requests': 'יותר מדי ניסיונות. נסה שוב בעוד מספר דקות.',
      'auth/network-request-failed': 'אין חיבור לרשת. בדוק את החיבור ונסה שוב.'
    };

    const inputClass = 'w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm text-left focus:outline-none focus:ring-2 focus:ring-blue-500';

    // Change password: used both as a forced first-login screen and as a voluntary modal.
    function ChangePasswordForm({ user, forced, onDone, onCancel }) {
      const [currentPw, setCurrentPw] = useState('');
      const [newPw, setNewPw] = useState('');
      const [confirmPw, setConfirmPw] = useState('');
      const [error, setError] = useState('');
      const [busy, setBusy] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        if (newPw.length < MIN_PASSWORD_LENGTH) return setError(`הסיסמה החדשה חייבת להכיל לפחות ${MIN_PASSWORD_LENGTH} תווים.`);
        if (newPw !== confirmPw) return setError('הסיסמה החדשה והאימות אינם זהים.');
        if (newPw === currentPw) return setError('הסיסמה החדשה חייבת להיות שונה מהנוכחית.');

        setBusy(true);
        try {
          const cred = firebase.auth.EmailAuthProvider.credential(user.email, currentPw);
          await user.reauthenticateWithCredential(cred);
          await user.updatePassword(newPw);
          await firebase.firestore().collection('users').doc(user.uid)
            .set({ mustChangePassword: false, passwordChangedAt: Date.now() }, { merge: true });
          onDone && onDone();
        } catch (err) {
          console.error('Password change failed:', err);
          setError(PASSWORD_ERRORS[err.code] || 'החלפת הסיסמה נכשלה. נסה שוב.');
          setBusy(false);
        }
      };

      return (
        <div className="bg-white w-full max-w-sm rounded-2xl shadow-xl border border-slate-200 overflow-hidden" dir="rtl">
          <div className="px-6 pt-6 pb-2">
            <h2 className="text-lg font-bold text-slate-900">{forced ? 'בחירת סיסמה אישית' : 'שינוי סיסמה'}</h2>
            {forced && (
              <p className="text-sm text-slate-500 mt-1">זו הכניסה הראשונה שלך. יש לבחור סיסמה חדשה במקום הסיסמה הזמנית שקיבלת.</p>
            )}
          </div>
          <form onSubmit={handleSubmit} className="px-6 pb-6 pt-2 flex flex-col gap-3">
            <div>
              <label htmlFor="cp-current" className="block text-xs font-bold text-slate-700 mb-1">{forced ? 'סיסמה זמנית' : 'סיסמה נוכחית'}</label>
              <input id="cp-current" type="password" autoComplete="current-password" required dir="ltr"
                value={currentPw} onChange={e => setCurrentPw(e.target.value)} className={inputClass} />
            </div>
            <div>
              <label htmlFor="cp-new" className="block text-xs font-bold text-slate-700 mb-1">סיסמה חדשה (לפחות {MIN_PASSWORD_LENGTH} תווים)</label>
              <input id="cp-new" type="password" autoComplete="new-password" required dir="ltr"
                value={newPw} onChange={e => setNewPw(e.target.value)} className={inputClass} />
            </div>
            <div>
              <label htmlFor="cp-confirm" className="block text-xs font-bold text-slate-700 mb-1">אימות סיסמה חדשה</label>
              <input id="cp-confirm" type="password" autoComplete="new-password" required dir="ltr"
                value={confirmPw} onChange={e => setConfirmPw(e.target.value)} className={inputClass} />
            </div>
            {error && <div role="alert" className="bg-red-50 text-red-700 border border-red-200 rounded-lg px-3 py-2 text-sm">{error}</div>}
            <div className="flex gap-3 mt-1">
              <button type="submit" disabled={busy}
                className="flex-1 bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white py-2.5 rounded-xl font-bold text-sm">
                {busy ? 'שומר...' : 'שמור סיסמה'}
              </button>
              {forced ? (
                <button type="button" onClick={() => firebase.auth().signOut()}
                  className="px-4 py-2.5 border border-slate-300 text-slate-700 rounded-xl font-bold text-sm hover:bg-slate-50">התנתק</button>
              ) : (
                <button type="button" onClick={onCancel}
                  className="px-4 py-2.5 border border-slate-300 text-slate-700 rounded-xl font-bold text-sm hover:bg-slate-50">ביטול</button>
              )}
            </div>
          </form>
        </div>
      );
    }

    function AccessDeniedScreen({ username, message }) {
      return (
        <div className="min-h-screen flex items-center justify-center bg-slate-50 p-4" dir="rtl">
          <div className="bg-white w-full max-w-sm rounded-2xl shadow-xl border border-slate-200 p-6 flex flex-col gap-4 text-center">
            <h2 className="text-lg font-bold text-slate-900">אין הרשאת גישה</h2>
            <p className="text-sm text-slate-600">
              {message || <>המשתמש <span dir="ltr" className="font-mono">{username}</span> אינו מורשה להשתמש במערכת, או שהגישה שלו נחסמה. פנה למנהל המערכת.</>}
            </p>
            <button onClick={() => firebase.auth().signOut()}
              className="bg-slate-800 hover:bg-slate-900 text-white py-2.5 rounded-xl font-bold text-sm">התנתק</button>
          </div>
        </div>
      );
    }

    const LoadingScreen = () => (
      <div className="min-h-screen flex items-center justify-center text-slate-400 text-sm">טוען...</div>
    );

    function AuthGate() {
      // user: undefined = still checking, null = signed out, object = signed in
      const [user, setUser] = useState(undefined);
      // profile (users/{uid}): undefined = loading, null = not on the allowed list, object = allowed
      const [profile, setProfile] = useState(undefined);
      const [initError, setInitError] = useState('');
      const [profileError, setProfileError] = useState('');

      useEffect(() => {
        try {
          initFirebaseApp();
          return firebase.auth().onAuthStateChanged(u => setUser(u || null));
        } catch (e) {
          console.error('Firebase Auth init failed:', e);
          setInitError('לא ניתן להתחבר לשרת ההזדהות. בדוק את החיבור לרשת.');
          setUser(null);
        }
      }, []);

      // Live-watch the signed-in user's entry in the allowed-users list.
      useEffect(() => {
        setProfile(undefined);
        setProfileError('');
        if (!user) return;

        const ref = firebase.firestore().collection('users').doc(user.uid);
        // includeMetadataChanges: also notify when a local write is confirmed by the server.
        const unsubscribe = ref.onSnapshot({ includeMetadataChanges: true }, async (snap) => {
          // Ignore local, not-yet-saved changes (e.g. right after a password change).
          // Otherwise the app opens before the server knows mustChangePassword=false,
          // and the orders listener gets permission-denied.
          if (snap.metadata.hasPendingWrites) return;
          if (snap.exists) {
            setProfile(snap.data());
            return;
          }
          if (isAdminUid(user.uid)) {
            // First admin login: register the admin in the allowed-users list.
            try {
              await ref.set({
                username: emailToUsername(user.email),
                role: 'admin',
                active: true,
                mustChangePassword: false,
                createdAt: Date.now()
              });
            } catch (e) {
              console.error('Admin profile create failed:', e);
              setProfile(null);
            }
            return;
          }
          setProfile(null);
        }, (err) => {
          console.error('Profile load failed:', err);
          setProfileError('לא ניתן לבדוק את הרשאות המשתמש. בדוק את החיבור לרשת ונסה שוב.');
          setProfile(null);
        });
        return () => unsubscribe();
      }, [user]);

      if (user === undefined) return <LoadingScreen />;
      if (!user) return <LoginScreen initError={initError} />;
      if (profile === undefined) return <LoadingScreen />;

      const isAdmin = isAdminUid(user.uid);
      const username = emailToUsername(user.email);

      if (!isAdmin && (!profile || profile.active === false)) {
        return <AccessDeniedScreen username={username} message={profileError} />;
      }

      if (profile && profile.mustChangePassword) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-50 p-4">
            <ChangePasswordForm user={user} forced />
          </div>
        );
      }

      return (
        <OrderTracker
          currentUser={user}
          currentUserName={username}
          currentDisplayName={(profile && profile.displayName) || ''}
          isAdmin={isAdmin}
          onLogout={() => firebase.auth().signOut()}
        />
      );
    }

    // ===== Admin: user management =====
    const generateTempPassword = () => {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
      const arr = new Uint32Array(10);
      crypto.getRandomValues(arr);
      return Array.from(arr, n => chars[n % chars.length]).join('');
    };

    // A second Firebase app instance, so creating a user doesn't sign the admin out.
    const getSecondaryAuth = async () => {
      const name = 'user-admin';
      const app = firebase.apps.find(a => a.name === name) || firebase.initializeApp(getActiveFirebaseConfig(), name);
      const auth = app.auth();
      await auth.setPersistence(firebase.auth.Auth.Persistence.NONE);
      return auth;
    };

    const CREATE_USER_ERRORS = {
      'auth/email-already-in-use': 'שם המשתמש כבר קיים. אם הוא נחסם בעבר, אפשר להפעיל אותו מחדש מהרשימה.',
      'auth/invalid-email': 'שם המשתמש אינו תקין.',
      'auth/weak-password': 'הסיסמה הזמנית חלשה מדי.',
      'auth/operation-not-allowed': 'יצירת משתמשים חסומה ב-Firebase. יש להפעיל Email/Password.',
      'auth/admin-restricted-operation': 'יצירת משתמשים חסומה ב-Firebase. יש להפעיל את "Enable create (sign-up)".',
      'auth/network-request-failed': 'אין חיבור לרשת. בדוק את החיבור ונסה שוב.',
      'permission-denied': 'אין הרשאה לעדכן את רשימת המשתמשים. בדוק את כללי האבטחה (Rules).'
    };

    function UserManagementModal({ adminUid, onClose }) {
      const [users, setUsers] = useState([]);
      const [listError, setListError] = useState('');
      const [newUsername, setNewUsername] = useState('');
      const [newDisplayName, setNewDisplayName] = useState('');
      const [tempPw, setTempPw] = useState(generateTempPassword);
      const [busy, setBusy] = useState(false);
      const [message, setMessage] = useState(null); // { type: 'ok'|'error', text, credentials? }

      useEffect(() => {
        return firebase.firestore().collection('users').onSnapshot(snap => {
          const list = snap.docs.map(d => ({ uid: d.id, ...d.data() }));
          list.sort((a, b) => (a.username || '').localeCompare(b.username || ''));
          setUsers(list);
        }, err => {
          console.error('Users list failed:', err);
          setListError('לא ניתן לטעון את רשימת המשתמשים.');
        });
      }, []);

      const handleCreate = async (e) => {
        e.preventDefault();
        setMessage(null);
        const username = newUsername.trim().toLowerCase();
        const displayName = newDisplayName.trim();
        if (!displayName) {
          return setMessage({ type: 'error', text: 'יש להזין שם מלא. הוא ימולא אוטומטית בשדה "מזמין".' });
        }
        if (!USERNAME_PATTERN.test(username)) {
          return setMessage({ type: 'error', text: 'שם משתמש: 2–30 תווים, אותיות באנגלית קטנות, ספרות, נקודה, מקף או קו תחתון בלבד.' });
        }
        if (tempPw.length < MIN_PASSWORD_LENGTH) {
          return setMessage({ type: 'error', text: `הסיסמה הזמנית חייבת להכיל לפחות ${MIN_PASSWORD_LENGTH} תווים.` });
        }

        setBusy(true);
        let createdUid = null;
        try {
          const secondaryAuth = await getSecondaryAuth();
          const cred = await secondaryAuth.createUserWithEmailAndPassword(usernameToEmail(username), tempPw);
          createdUid = cred.user.uid;
          await secondaryAuth.signOut();

          await firebase.firestore().collection('users').doc(createdUid).set({
            username,
            displayName,
            role: 'user',
            active: true,
            mustChangePassword: true,
            createdAt: Date.now(),
            createdBy: adminUid
          });

          setMessage({ type: 'ok', text: `המשתמש נוצר. העבר לעובד את הפרטים הבאים (בערוץ פרטי):`, credentials: { username, password: tempPw } });
          setNewUsername('');
          setNewDisplayName('');
          setTempPw(generateTempPassword());
        } catch (err) {
          console.error('Create user failed:', err);
          let text = CREATE_USER_ERRORS[err.code] || 'יצירת המשתמש נכשלה.';
          if (createdUid) text = 'החשבון נוצר, אך הוספתו לרשימת המורשים נכשלה. ' + text;
          setMessage({ type: 'error', text });
        }
        setBusy(false);
      };

      const updateUser = async (u, changes, confirmText) => {
        if (confirmText && !window.confirm(confirmText)) return;
        try {
          await firebase.firestore().collection('users').doc(u.uid).update(changes);
        } catch (err) {
          console.error('Update user failed:', err);
          alert(CREATE_USER_ERRORS[err.code] || 'העדכון נכשל.');
        }
      };

      const handleEditDisplayName = async (u) => {
        const next = window.prompt(`שם מלא עבור ${u.username} (ימולא אוטומטית בשדה "מזמין"):`, u.displayName || '');
        if (next === null) return;
        const trimmed = next.trim();
        if (!trimmed) return alert('השם לא יכול להיות ריק.');
        await updateUser(u, { displayName: trimmed });
      };

      const statusOf = (u) => {
        if (u.active === false) return { text: 'חסום', cls: 'bg-red-50 text-red-700 border-red-200' };
        if (u.mustChangePassword) return { text: 'ממתין להחלפת סיסמה', cls: 'bg-amber-50 text-amber-700 border-amber-200' };
        return { text: 'פעיל', cls: 'bg-emerald-50 text-emerald-700 border-emerald-200' };
      };

      return (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto border border-slate-100">
            <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 sticky top-0">
              <h3 className="text-lg font-bold text-slate-900">ניהול משתמשים</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600" title="סגור"><IconX /></button>
            </div>

            <form onSubmit={handleCreate} className="p-6 border-b border-slate-100 flex flex-col gap-3">
              <h4 className="text-sm font-bold text-slate-800">הוספת משתמש חדש</h4>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                  <label htmlFor="um-display" className="block text-xs font-bold text-slate-700 mb-1">שם מלא (למזמין)</label>
                  <input id="um-display" type="text" autoComplete="off" required placeholder="לדוגמה: משה כהן"
                    value={newDisplayName} onChange={e => setNewDisplayName(e.target.value)}
                    className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                <div>
                  <label htmlFor="um-username" className="block text-xs font-bold text-slate-700 mb-1">שם משתמש</label>
                  <input id="um-username" type="text" autoComplete="off" required dir="ltr" placeholder="e.g. moshe"
                    value={newUsername} onChange={e => setNewUsername(e.target.value)} className={inputClass} />
                </div>
                <div>
                  <label htmlFor="um-temp" className="block text-xs font-bold text-slate-700 mb-1">סיסמה זמנית</label>
                  <div className="flex gap-2">
                    <input id="um-temp" type="text" autoComplete="off" required dir="ltr"
                      value={tempPw} onChange={e => setTempPw(e.target.value)} className={inputClass + ' font-mono'} />
                    <button type="button" onClick={() => setTempPw(generateTempPassword())}
                      className="px-3 border border-slate-300 rounded-lg text-xs font-bold text-slate-700 hover:bg-slate-100 whitespace-nowrap">חדשה</button>
                  </div>
                </div>
              </div>
              <p className="text-xs text-slate-500">העובד יידרש לבחור סיסמה אישית בכניסה הראשונה.</p>
              {message && (
                <div role="alert" className={`rounded-lg px-3 py-2 text-sm border ${message.type === 'ok' ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : 'bg-red-50 text-red-700 border-red-200'}`}>
                  <div>{message.text}</div>
                  {message.credentials && (
                    <div className="mt-2 font-mono text-xs bg-white border border-emerald-200 rounded p-2 flex items-center justify-between gap-2" dir="ltr">
                      <span>username: {message.credentials.username} · password: {message.credentials.password}</span>
                      <button type="button"
                        onClick={() => navigator.clipboard.writeText(`שם משתמש: ${message.credentials.username}\nסיסמה זמנית: ${message.credentials.password}`).catch(() => {})}
                        className="text-emerald-700 hover:bg-emerald-50 p-1 rounded" title="העתק"><IconCopy /></button>
                    </div>
                  )}
                </div>
              )}
              <button type="submit" disabled={busy}
                className="self-start bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white px-5 py-2.5 rounded-xl font-bold text-sm">
                {busy ? 'יוצר...' : 'צור משתמש'}
              </button>
            </form>

            <div className="p-6">
              <h4 className="text-sm font-bold text-slate-800 mb-3">משתמשים ({users.length})</h4>
              {listError && <div className="text-sm text-red-700 mb-2">{listError}</div>}
              <div className="flex flex-col divide-y divide-slate-100 border border-slate-200 rounded-xl">
                {users.map(u => {
                  const st = statusOf(u);
                  const isSelfAdmin = u.role === 'admin' || isAdminUid(u.uid);
                  return (
                    <div key={u.uid} className="flex flex-wrap items-center justify-between gap-2 px-4 py-3">
                      <div className="flex flex-wrap items-center gap-2">
                        <span className="text-sm font-semibold text-slate-900">{u.displayName || <span className="text-slate-400 font-normal">ללא שם מלא</span>}</span>
                        <span className="font-mono text-xs text-slate-500" dir="ltr">{u.username}</span>
                        <button onClick={() => handleEditDisplayName(u)} className="p-1 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded" title="ערוך שם מלא"><IconEdit /></button>
                        {isSelfAdmin && <span className="text-xs bg-blue-50 text-blue-700 border border-blue-200 px-2 py-0.5 rounded-full font-bold">מנהל</span>}
                        <span className={`text-xs border px-2 py-0.5 rounded-full font-bold ${st.cls}`}>{st.text}</span>
                      </div>
                      {!isSelfAdmin && (
                        <div className="flex gap-2">
                          {u.active !== false && !u.mustChangePassword && (
                            <button onClick={() => updateUser(u, { mustChangePassword: true }, `לחייב את ${u.username} לבחור סיסמה חדשה בכניסה הבאה?`)}
                              className="text-xs px-3 py-1.5 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-100 font-semibold">חייב החלפת סיסמה</button>
                          )}
                          {u.active === false ? (
                            <button onClick={() => updateUser(u, { active: true })}
                              className="text-xs px-3 py-1.5 rounded-lg border border-emerald-300 text-emerald-700 hover:bg-emerald-50 font-semibold">הפעל מחדש</button>
                          ) : (
                            <button onClick={() => updateUser(u, { active: false }, `לחסום את ${u.username}? הוא לא יוכל לגשת למערכת עד שתפעיל אותו מחדש.`)}
                              className="text-xs px-3 py-1.5 rounded-lg border border-red-300 text-red-700 hover:bg-red-50 font-semibold">חסום</button>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}
                {users.length === 0 && !listError && <div className="px-4 py-6 text-center text-sm text-slate-400">אין משתמשים עדיין.</div>}
              </div>
              <p className="text-xs text-slate-500 mt-3">
                עובד ששכח סיסמה: מאפסים לו סיסמה ב-Firebase Console (Authentication ← Users), ואז לוחצים כאן "חייב החלפת סיסמה".
              </p>
            </div>
          </div>
        </div>
      );
    }

    // ===== Admin: weekly email automation settings =====
    // Stored in Firestore at settings/automation. Read by the Google Apps Script
    // (automation/weekly-email.gs), which runs every Sunday at 08:00.
    const AUTOMATION_DOC = ['settings', 'automation'];
    const AUTOMATION_DEFAULTS = {
      enabled: false,
      recipientEmail: '',
      ccEmail: '',
      replyTo: '',
      relayEmail: '',
      minItems: 2,
      subject: 'פריטים להזמנה – {תאריך} ({כמות} פריטים)',
      body: 'שלום,\n\nמצורף קובץ אקסל עם {כמות} פריטים שממתינים להזמנה.\n\nתודה,\nמערכת מעקב הזמנות'
    };
    const EMAIL_PATTERN = /^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/;
    const splitEmails = (s) => (s || '').split(/[,;\s]+/).map(x => x.trim()).filter(Boolean);
    const allEmailsValid = (s) => splitEmails(s).every(e => EMAIL_PATTERN.test(e));

    const LAST_RUN_LABELS = {
      sent: 'נשלח מייל',
      'below-threshold': 'לא נשלח – פחות פריטים מהסף',
      disabled: 'לא נשלח – האוטומציה כבויה',
      'no-recipient': 'לא נשלח – לא הוגדר נמען',
      test: 'שליחת בדיקה',
      error: 'שגיאה'
    };

    function AutomationSettingsModal({ adminUid, onClose }) {
      const [form, setForm] = useState(null);
      const [lastRun, setLastRun] = useState(null);
      const [busy, setBusy] = useState(false);
      const [message, setMessage] = useState(null);

      useEffect(() => {
        const ref = firebase.firestore().collection(AUTOMATION_DOC[0]).doc(AUTOMATION_DOC[1]);
        ref.get().then(snap => {
          const data = snap.exists ? snap.data() : {};
          setForm({ ...AUTOMATION_DEFAULTS, ...data });
          setLastRun(data.lastRun || null);
        }).catch(err => {
          console.error('Automation settings load failed:', err);
          setForm({ ...AUTOMATION_DEFAULTS });
          setMessage({ type: 'error', text: err.code === 'permission-denied'
            ? 'אין הרשאה לקרוא את ההגדרות. יש לעדכן את כללי האבטחה (Rules) ב-Firebase.'
            : 'טעינת ההגדרות נכשלה.' });
        });
      }, []);

      if (!form) {
        return (
          <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 p-4">
            <div className="bg-white rounded-2xl p-6 text-slate-500 text-sm">טוען הגדרות...</div>
          </div>
        );
      }

      const set = (key) => (e) => setForm(prev => ({ ...prev, [key]: e.target.type === 'checkbox' ? e.target.checked : e.target.value }));

      const handleSave = async (e) => {
        e.preventDefault();
        setMessage(null);
        const minItems = parseInt(form.minItems, 10);
        if (form.enabled && splitEmails(form.recipientEmail).length === 0) {
          return setMessage({ type: 'error', text: 'כדי להפעיל את האוטומציה יש להזין כתובת נמען.' });
        }
        if (!allEmailsValid(form.recipientEmail) || !allEmailsValid(form.ccEmail) || !allEmailsValid(form.replyTo)) {
          return setMessage({ type: 'error', text: 'אחת מכתובות המייל אינה תקינה. כמה כתובות מפרידים בפסיק.' });
        }
        if (splitEmails(form.relayEmail).length > 1 || !allEmailsValid(form.relayEmail)) {
          return setMessage({ type: 'error', text: 'תיבת הממסר צריכה להיות כתובת מייל אחת תקינה.' });
        }
        if (!Number.isInteger(minItems) || minItems < 1 || minItems > 1000) {
          return setMessage({ type: 'error', text: 'הסף חייב להיות מספר שלם, 1 ומעלה.' });
        }
        if (!form.subject.trim()) {
          return setMessage({ type: 'error', text: 'יש להזין נושא למייל.' });
        }

        setBusy(true);
        try {
          await firebase.firestore().collection(AUTOMATION_DOC[0]).doc(AUTOMATION_DOC[1]).set({
            enabled: Boolean(form.enabled),
            recipientEmail: splitEmails(form.recipientEmail).join(', '),
            ccEmail: splitEmails(form.ccEmail).join(', '),
            replyTo: splitEmails(form.replyTo).join(', '),
            relayEmail: splitEmails(form.relayEmail).join(''),
            minItems,
            subject: form.subject.trim(),
            body: form.body,
            updatedAt: Date.now(),
            updatedBy: adminUid
          }, { merge: true });
          setMessage({ type: 'ok', text: 'ההגדרות נשמרו.' });
        } catch (err) {
          console.error('Automation settings save failed:', err);
          setMessage({ type: 'error', text: err.code === 'permission-denied'
            ? 'אין הרשאה לשמור. יש לעדכן את כללי האבטחה (Rules) ב-Firebase.'
            : 'השמירה נכשלה.' });
        }
        setBusy(false);
      };

      const labelCls = 'block text-xs font-bold text-slate-700 mb-1';
      const textCls = 'w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500';

      return (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto border border-slate-100">
            <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 sticky top-0">
              <h3 className="text-lg font-bold text-slate-900">אוטומציה – מייל שבועי</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600" title="סגור"><IconX /></button>
            </div>

            <form onSubmit={handleSave} className="p-6 flex flex-col gap-4">
              <p className="text-sm text-slate-600">
                בכל יום ראשון בסביבות 08:00 המערכת בודקת כמה פריטים (שאינם בארכיון) נמצאים בסטטוס "ראשוני".
                אם יש לפחות מספר הפריטים שבסף, נשלח מייל עם קובץ אקסל (אותן 5 עמודות כמו בייצוא), והפריטים עוברים לסטטוס "נשלחה לשגיא".
              </p>

              <label className="flex items-center gap-2 text-sm font-bold text-slate-800">
                <input type="checkbox" checked={Boolean(form.enabled)} onChange={set('enabled')} className="w-4 h-4" />
                האוטומציה פעילה
              </label>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label htmlFor="au-to" className={labelCls}>נמען (אל)</label>
                  <input id="au-to" type="text" dir="ltr" autoComplete="off" placeholder="name@alphatau.com"
                    value={form.recipientEmail} onChange={set('recipientEmail')} className={inputClass} />
                </div>
                <div>
                  <label htmlFor="au-cc" className={labelCls}>העתק (CC) – לא חובה</label>
                  <input id="au-cc" type="text" dir="ltr" autoComplete="off" placeholder="name@alphatau.com"
                    value={form.ccEmail} onChange={set('ccEmail')} className={inputClass} />
                </div>
                <div>
                  <label htmlFor="au-reply" className={labelCls}>כתובת לתשובות (Reply-To) – לא חובה</label>
                  <input id="au-reply" type="text" dir="ltr" autoComplete="off" placeholder="name@alphatau.com"
                    value={form.replyTo} onChange={set('replyTo')} className={inputClass} />
                </div>
                <div>
                  <label htmlFor="au-min" className={labelCls}>לשלוח כשיש לפחות X פריטים</label>
                  <input id="au-min" type="number" min="1" step="1" dir="ltr"
                    value={form.minItems} onChange={set('minItems')} className={inputClass} />
                </div>
              </div>
              <p className="text-xs text-slate-500 -mt-2">כמה כתובות באותו שדה מפרידים בפסיק.</p>

              <div className="bg-blue-50 border border-blue-200 rounded-lg p-3">
                <label htmlFor="au-relay" className={labelCls}>שליחה דרך Outlook – תיבת ממסר (לא חובה)</label>
                <input id="au-relay" type="text" dir="ltr" autoComplete="off" placeholder="yourname@alphatau.com"
                  value={form.relayEmail} onChange={set('relayEmail')} className={inputClass} />
                <p className="text-xs text-slate-600 mt-1">
                  אם השדה מלא, המייל נשלח קודם לתיבה הזו, ו-Power Automate שולח אותו משם לנמענים מחשבון ה-Outlook.
                  אם השדה ריק, המייל נשלח ישירות מחשבון ה-Gmail (ואז משמשת כתובת ה-Reply-To).
                </p>
              </div>

              <div>
                <label htmlFor="au-subject" className={labelCls}>נושא המייל</label>
                <input id="au-subject" type="text" value={form.subject} onChange={set('subject')} className={textCls} />
              </div>
              <div>
                <label htmlFor="au-body" className={labelCls}>נוסח המייל</label>
                <textarea id="au-body" rows="7" value={form.body} onChange={set('body')} className={textCls + ' resize-y'} />
                <p className="text-xs text-slate-500 mt-1">
                  אפשר לשלב בנושא ובנוסח: <span className="font-mono">{'{כמות}'}</span> = מספר הפריטים, <span className="font-mono">{'{תאריך}'}</span> = תאריך השליחה.
                  {' '}<button type="button" className="text-blue-600 hover:underline"
                    onClick={() => setForm(prev => ({ ...prev, subject: AUTOMATION_DEFAULTS.subject, body: AUTOMATION_DEFAULTS.body }))}>
                    החזר לנוסח ברירת המחדל
                  </button>
                </p>
              </div>

              {lastRun && (
                <div className="text-xs text-slate-600 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2">
                  ריצה אחרונה: {lastRun.at ? new Date(lastRun.at).toLocaleString('he-IL') : '—'} · {LAST_RUN_LABELS[lastRun.result] || lastRun.result}
                  {typeof lastRun.itemCount === 'number' ? ` · ${lastRun.itemCount} פריטים` : ''}
                  {lastRun.message ? ` · ${lastRun.message}` : ''}
                </div>
              )}

              {message && (
                <div role="alert" className={`rounded-lg px-3 py-2 text-sm border ${message.type === 'ok' ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : 'bg-red-50 text-red-700 border-red-200'}`}>
                  {message.text}
                </div>
              )}

              <div className="flex gap-2">
                <button type="submit" disabled={busy}
                  className="bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white px-5 py-2.5 rounded-xl font-bold text-sm">
                  {busy ? 'שומר...' : 'שמור הגדרות'}
                </button>
                <button type="button" onClick={onClose}
                  className="px-5 py-2.5 rounded-xl font-bold text-sm border border-slate-300 text-slate-700 hover:bg-slate-100">סגור</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function OrderTracker({ currentUser, currentUserName, currentDisplayName, isAdmin, onLogout }) {
      const [showUserMgmt, setShowUserMgmt] = useState(false);
      const [showAutomation, setShowAutomation] = useState(false);
      const [showChangePw, setShowChangePw] = useState(false);
      const [accessError, setAccessError] = useState('');
      const [orders, setOrders] = useState([]);
      const [showArchive, setShowArchive] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedProjectFilter, setSelectedProjectFilter] = useState('ALL');
      const [sortConfig, setSortConfig] = useState({ key: 'createdAt', direction: 'desc' });
      const [copiedId, setCopiedId] = useState(null);
      const [selectedIds, setSelectedIds] = useState([]);
      
      const [dbInstance, setDbInstance] = useState(null);
      const [isCloudActive, setIsCloudActive] = useState(false);
      const [firebaseConfigModal, setFirebaseConfigModal] = useState(false);
      const [configInput, setConfigInput] = useState('');

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingOrder, setEditingOrder] = useState(null);
      
      const [notesModalOrder, setNotesModalOrder] = useState(null);
      const [currentNotes, setCurrentNotes] = useState('');

      const [trackingModalOrder, setTrackingModalOrder] = useState(null);
      const [currentTrackingNumber, setCurrentTrackingNumber] = useState('');

      const [formData, setFormData] = useState({
        itemName: '',
        requestedBy: '',
        orderNumber: '',
        trackingNumber: '',
        quantity: 1,
        project: '',
        url: '',
        status: STATUS_OPTIONS[0],
        notes: ''
      });

      useEffect(() => {
        let activeConfig = DEFAULT_FIREBASE_CONFIG;
        const savedConfig = localStorage.getItem('user_firebase_config');
        
        if (savedConfig) {
          try { activeConfig = JSON.parse(savedConfig); } catch(e) {}
        }

        const hasValidConfig = activeConfig && activeConfig.projectId && activeConfig.projectId.trim() !== '';

        if (hasValidConfig) {
          try {
            if (!firebase.apps.length) {
              firebase.initializeApp(activeConfig);
            }
            const db = firebase.firestore();
            setDbInstance(db);
            setIsCloudActive(true);

            let unsubscribe = () => {};
            let retryTimer = null;
            let attempts = 0;
            let stopped = false;
            const MAX_PERMISSION_RETRIES = 3;

            const subscribe = () => {
              unsubscribe = db.collection('orders').onSnapshot(snapshot => {
                attempts = 0;
                setAccessError('');
                const cloudOrders = snapshot.docs.map(doc => ({
                  id: doc.id,
                  ...doc.data()
                }));
                setOrders(cloudOrders);
              }, (err) => {
                console.error("Firestore error:", err);
                if (err.code === 'permission-denied') {
                  // Permissions may still be propagating (e.g. right after a password change): retry a few times.
                  if (!stopped && attempts < MAX_PERMISSION_RETRIES) {
                    attempts += 1;
                    retryTimer = setTimeout(subscribe, 1500 * attempts);
                    return;
                  }
                  // Signed in but not allowed: don't fall back to local mode, just show the error.
                  setOrders([]);
                  setAccessError('אין לך הרשאה לצפות בהזמנות. נסה לרענן את הדף; אם זה חוזר, פנה למנהל המערכת.');
                  return;
                }
                setIsCloudActive(false);
                loadLocalFallback();
              });
            };
            subscribe();

            return () => {
              stopped = true;
              if (retryTimer) clearTimeout(retryTimer);
              unsubscribe();
            };
          } catch (e) {
            console.error("Firebase init failed:", e);
            setIsCloudActive(false);
            loadLocalFallback();
          }
        } else {
          setIsCloudActive(false);
          loadLocalFallback();
        }
      }, []);

      const loadLocalFallback = () => {
        const stored = localStorage.getItem('company_orders_data');
        if (stored) {
          try { setOrders(JSON.parse(stored)); } catch(e) { setOrders(MOCK_ORDERS); }
        } else {
          setOrders(MOCK_ORDERS);
        }
      };

      useEffect(() => {
        if (!isCloudActive && orders.length > 0) {
          localStorage.setItem('company_orders_data', JSON.stringify(orders));
        }
      }, [orders, isCloudActive]);

      const handleSaveCloudConfig = () => {
        try {
          const parsed = JSON.parse(configInput);
          localStorage.setItem('user_firebase_config', JSON.stringify(parsed));
          window.location.reload();
        } catch(e) {
          alert('הקוד שאתה מחזיק אינו JSON תקין.');
        }
      };

      // רשימת פרויקטים ייחודיים
      const existingProjects = useMemo(() => {
        const setP = new Set();
        orders.forEach(o => {
          if (o.project && typeof o.project === 'string' && o.project.trim()) {
            setP.add(o.project.trim());
          }
        });
        return Array.from(setP);
      }, [orders]);

      // רשימת מזמינים ייחודיים
      const existingRequestedBy = useMemo(() => {
        const setR = new Set();
        orders.forEach(o => {
          const val = o.requestedBy || o.orderer || o.ordererName;
          if (val && typeof val === 'string' && val.trim()) {
            setR.add(val.trim());
          }
        });
        return Array.from(setR);
      }, [orders]);

      const stats = useMemo(() => {
        const active = orders.filter(o => !o.isArchived);
        const archived = orders.filter(o => o.isArchived);
        const completed = active.filter(o => o.status === 'אומתה ונסגרה').length;
        const pending = active.length - completed;
        return { totalActive: active.length, pending, completed, archivedCount: archived.length };
      }, [orders]);

      const handleSort = (key) => {
        setSortConfig(prev => {
          if (prev.key === key) {
            return { key, direction: prev.direction === 'asc' ? 'desc' : 'asc' };
          }
          return { key, direction: 'asc' };
        });
      };

      const handleOpenModal = (order = null) => {
        if (order) {
          setEditingOrder(order);
          setFormData({
            itemName: order.itemName || '',
            requestedBy: order.requestedBy || order.orderer || order.ordererName || '',
            orderNumber: order.orderNumber || '',
            trackingNumber: order.trackingNumber || '',
            quantity: order.quantity || 1,
            project: order.project || '',
            url: order.url || '',
            status: order.status || STATUS_OPTIONS[0],
            notes: order.notes || ''
          });
        } else {
          setEditingOrder(null);
          setFormData({
            itemName: '',
            // Pre-filled with the signed-in user's full name; can be changed when ordering for someone else.
            requestedBy: currentDisplayName || '',
            orderNumber: '',
            trackingNumber: '',
            quantity: 1,
            project: '',
            url: '',
            status: STATUS_OPTIONS[0],
            notes: ''
          });
        }
        setIsModalOpen(true);
      };

      const handleSaveOrder = async (e) => {
        e.preventDefault();
        if (!formData.itemName.trim()) return;

        const payload = {
          itemName: formData.itemName.trim(),
          requestedBy: formData.requestedBy.trim(),
          orderNumber: formData.orderNumber.trim(),
          trackingNumber: formData.trackingNumber.trim(),
          quantity: Number(formData.quantity) || 1,
          project: formData.project.trim(),
          url: formData.url.trim(),
          status: formData.status,
          notes: formData.notes.trim(),
          isArchived: editingOrder ? Boolean(editingOrder.isArchived) : false,
          date: editingOrder ? editingOrder.date : new Date().toISOString(),
          createdAt: editingOrder ? (editingOrder.createdAt || Date.now()) : Date.now()
        };

        if (isCloudActive && dbInstance) {
          if (editingOrder) {
            await dbInstance.collection('orders').doc(editingOrder.id).update(payload);
          } else {
            await dbInstance.collection('orders').add(payload);
          }
        } else {
          if (editingOrder) {
            setOrders(prev => prev.map(o => o.id === editingOrder.id ? { ...o, ...payload } : o));
          } else {
            const newOrder = { id: 'ord-' + Date.now(), ...payload };
            setOrders(prev => [newOrder, ...prev]);
          }
        }

        setIsModalOpen(false);
      };

      const handleStatusChange = async (orderId, newStatus) => {
        if (isCloudActive && dbInstance) {
          await dbInstance.collection('orders').doc(orderId).update({ status: newStatus });
        } else {
          setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: newStatus } : o));
        }
      };

      const toggleArchive = async (orderId, currentArchivedState) => {
        const nextState = !currentArchivedState;
        if (isCloudActive && dbInstance) {
          await dbInstance.collection('orders').doc(orderId).update({ isArchived: nextState });
        } else {
          setOrders(prev => prev.map(o => o.id === orderId ? { ...o, isArchived: nextState } : o));
        }
      };

      const handleDeleteOrder = async (order) => {
        const label = order.itemName || 'ללא שם';
        if (!window.confirm(`למחוק לצמיתות את ההזמנה "${label}"?\n\nלא ניתן לשחזר פעולה זו.`)) return;

        try {
          if (isCloudActive && dbInstance) {
            await dbInstance.collection('orders').doc(order.id).delete();
          } else {
            setOrders(prev => prev.filter(o => o.id !== order.id));
          }
          setSelectedIds(prev => prev.filter(id => id !== order.id));
        } catch (err) {
          console.error('Delete failed:', err);
          alert('המחיקה נכשלה. ייתכן שאין לך הרשאה או שאין חיבור לרשת.');
        }
      };

      const handleSaveNotes = async () => {
        if (!notesModalOrder) return;
        const updatedNotes = currentNotes.trim();

        if (isCloudActive && dbInstance) {
          await dbInstance.collection('orders').doc(notesModalOrder.id).update({ notes: updatedNotes });
        } else {
          setOrders(prev => prev.map(o => o.id === notesModalOrder.id ? { ...o, notes: updatedNotes } : o));
        }
        setNotesModalOrder(null);
      };

      const handleSaveTracking = async () => {
        if (!trackingModalOrder) return;
        const updatedTracking = currentTrackingNumber.trim();

        if (isCloudActive && dbInstance) {
          await dbInstance.collection('orders').doc(trackingModalOrder.id).update({ trackingNumber: updatedTracking });
        } else {
          setOrders(prev => prev.map(o => o.id === trackingModalOrder.id ? { ...o, trackingNumber: updatedTracking } : o));
        }
        setTrackingModalOrder(null);
      };

      const formatUrl = (url) => {
        if (!url) return '';
        let trimmed = url.trim();
        return /^https?:\/\//i.test(trimmed) ? trimmed : 'https://' + trimmed;
      };

      const handleCopyLink = (rawUrl, id) => {
        if (!rawUrl) return;
        const formatted = formatUrl(rawUrl);
        navigator.clipboard.writeText(formatted).catch(() => {});
        setCopiedId(id);
        setTimeout(() => setCopiedId(null), 2000);
      };

      const toggleSelectOrder = (id) => {
        setSelectedIds(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
      };

      const toggleSelectAll = () => {
        const displayed = displayedOrders.map(o => o.id);
        const allSelected = displayed.length > 0 && displayed.every(id => selectedIds.includes(id));
        setSelectedIds(allSelected ? prev => prev.filter(id => !displayed.includes(id)) : prev => Array.from(new Set([...prev, ...displayed])));
      };

      const handleExportExcel = () => {
        const toExport = selectedIds.length > 0 ? orders.filter(o => selectedIds.includes(o.id)) : displayedOrders;
        if (toExport.length === 0) return;

        // הסרת עמודת "מזמין" ממבנה הנתונים לייצוא
        const headers = ['שם הפריט', 'כמות', 'פרויקט', 'קישור', 'הערות'];
        const data = [headers];

        toExport.forEach(o => {
          data.push([
            o.itemName || '',
            o.quantity || 1,
            o.project || '',
            o.url ? 'קישור' : '',
            o.notes || ''
          ]);
        });

        const ws = XLSX.utils.aoa_to_sheet(data);

        ws['!cols'] = [
          { wch: 30 },
          { wch: 8 },
          { wch: 18 },
          { wch: 12 },
          { wch: 35 }
        ];

        const headerStyle = {
          fill: { fgColor: { rgb: "D1FAE5" } },
          font: { bold: true, color: { rgb: "065F46" }, name: "Arial", sz: 11 },
          alignment: { horizontal: "right", vertical: "center" }
        };

        const cellStyle = {
          font: { name: "Arial", sz: 10 },
          alignment: { horizontal: "right", vertical: "center" }
        };

        const linkStyle = {
          font: { color: { rgb: "2563EB" }, underline: true, name: "Arial", sz: 10 },
          alignment: { horizontal: "right", vertical: "center" }
        };

        const range = XLSX.utils.decode_range(ws['!ref']);

        for (let R = range.s.r; R <= range.e.r; ++R) {
          for (let C = range.s.c; C <= range.e.c; ++C) {
            const cellAddress = XLSX.utils.encode_cell({ r: R, c: C });
            if (!ws[cellAddress]) continue;

            if (R === 0) {
              ws[cellAddress].s = headerStyle;
            } else {
              ws[cellAddress].s = cellStyle;
              // עמודת הקישור זזה עכשיו לאינדקס 3 (מכיוון שהסרנו את מזמין)
              if (C === 3 && toExport[R - 1] && toExport[R - 1].url) {
                const rawUrl = formatUrl(toExport[R - 1].url);
                ws[cellAddress].l = { Target: rawUrl, Tooltip: rawUrl };
                ws[cellAddress].s = linkStyle;
              }
            }
          }
        }

        const wb = XLSX.utils.book_new();
        wb.Workbook = { Views: [{ RTL: true }] };

        XLSX.utils.book_append_sheet(wb, ws, "הזמנות");
        XLSX.writeFile(wb, `דוח_הזמנות_${new Date().toISOString().slice(0, 10)}.xlsx`);
      };
      
      const displayedOrders = useMemo(() => {
        return orders
          .filter(o => Boolean(o.isArchived) === showArchive)
          .filter(o => {
            const reqName = o.requestedBy || o.orderer || o.ordererName || '';
            const matchSearch = 
              (o.itemName || '').toLowerCase().includes(searchTerm.toLowerCase()) || 
              reqName.toLowerCase().includes(searchTerm.toLowerCase()) ||
              (o.orderNumber || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
              (o.project || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
              (o.notes || '').toLowerCase().includes(searchTerm.toLowerCase());
            const matchProject = selectedProjectFilter === 'ALL' || o.project === selectedProjectFilter;
            return matchSearch && matchProject;
          })
          .sort((a, b) => {
            if (sortConfig.key === 'createdAt') {
              const timeA = a.createdAt || 0;
              const timeB = b.createdAt || 0;
              return sortConfig.direction === 'asc' ? timeA - timeB : timeB - timeA;
            }
            if (sortConfig.key === 'quantity') {
              return sortConfig.direction === 'asc' ? (a.quantity || 1) - (b.quantity || 1) : (b.quantity || 1) - (a.quantity || 1);
            }
            const valA = (a[sortConfig.key] || '').toString().toLowerCase();
            const valB = (b[sortConfig.key] || '').toString().toLowerCase();
            return sortConfig.direction === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
          });
      }, [orders, showArchive, searchTerm, selectedProjectFilter, sortConfig]);

      return (
        <div className="min-h-screen bg-slate-50 font-sans text-slate-800 pb-12" dir="rtl">
          {/* Header */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
              <div className="flex items-center gap-3">
                <div className="bg-blue-600 p-2.5 rounded-xl text-white shadow-md shadow-blue-500/20">
                  <IconClipboardList />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-xl sm:text-2xl font-bold text-slate-900">מערכת מעקב הזמנות</h1>
                    <button 
                      onClick={() => setFirebaseConfigModal(true)}
                      className={`inline-flex items-center gap-1 text-xs px-2.5 py-1 rounded-full font-bold transition-all ${
                        isCloudActive 
                          ? 'bg-emerald-100 text-emerald-800 hover:bg-emerald-200' 
                          : 'bg-amber-100 text-amber-800 hover:bg-amber-200'
                      }`}
                      title="לחץ להגדרת חיבור הענן"
                    >
                      {isCloudActive ? <IconCloud /> : <IconCloudOff />}
                      <span>{isCloudActive ? 'מחובר לסנכרון ענן' : 'מצב מקומי בלבד (לחץ לחיבור)'}</span>
                    </button>
                  </div>
                  <p className="text-xs sm:text-sm text-slate-500">ניהול דרישות, אישורים וסטטוס רכש בזמן אמת</p>
                </div>
              </div>

              <div className="flex items-center gap-3 flex-wrap justify-end">
                <button
                  onClick={handleExportExcel}
                  className="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-md transition-all active:scale-95"
                >
                  <IconDownload />
                  <span>{selectedIds.length > 0 ? `ייצא מסומנים (${selectedIds.length})` : 'ייצא לאקסל'}</span>
                </button>

                <button
                  onClick={() => setShowArchive(!showArchive)}
                  className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold border transition-all ${
                    showArchive ? 'bg-amber-50 text-amber-700 border-amber-300 hover:bg-amber-100' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'
                  }`}
                >
                  <IconArchive />
                  <span>{showArchive ? 'חזור להזמנות פעילות' : 'ארכיון הזמנות'}</span>
                  {stats.archivedCount > 0 && (
                    <span className="bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full text-xs font-bold">{stats.archivedCount}</span>
                  )}
                </button>

                <button
                  onClick={() => handleOpenModal()}
                  className="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-md transition-all active:scale-95"
                >
                  <IconPlus />
                  <span>הזמנה חדשה</span>
                </button>

                {isAdmin && (
                  <button
                    onClick={() => setShowUserMgmt(true)}
                    className="px-4 py-2 rounded-xl text-sm font-semibold border bg-white text-slate-700 border-slate-300 hover:bg-slate-100 transition-all"
                  >
                    ניהול משתמשים
                  </button>
                )}

                {isAdmin && (
                  <button
                    onClick={() => setShowAutomation(true)}
                    className="px-4 py-2 rounded-xl text-sm font-semibold border bg-white text-slate-700 border-slate-300 hover:bg-slate-100 transition-all"
                  >
                    אוטומציה
                  </button>
                )}

                <div className="flex items-center gap-2 border-r border-slate-200 pr-3">
                  <button
                    onClick={() => setShowChangePw(true)}
                    className="text-xs text-slate-500 hover:text-blue-600 underline-offset-2 hover:underline"
                    title="שינוי סיסמה"
                    dir="ltr"
                  >
                    {currentUserName}
                  </button>
                  <button
                    onClick={onLogout}
                    className="px-3 py-2 rounded-xl text-sm font-semibold border bg-white text-slate-700 border-slate-300 hover:bg-slate-100 transition-all"
                  >
                    התנתק
                  </button>
                </div>
              </div>
            </div>
          </header>

          {accessError && (
            <div role="alert" className="bg-red-600 text-white px-4 py-2.5 text-center text-sm font-medium">{accessError}</div>
          )}

          {!isCloudActive && (
            <div className="bg-amber-500 text-white px-4 py-2.5 text-center text-xs sm:text-sm font-medium flex items-center justify-center gap-2 shadow-inner">
              <span>⚠️ <strong>שים לב:</strong> המערכת פועלת כרגע במצב זיכרון מקומי. שינויים שתבצע יישמרו רק במחשב זה.</span>
              <button 
                onClick={() => setFirebaseConfigModal(true)}
                className="underline font-bold hover:text-amber-100 bg-black/10 px-2 py-0.5 rounded"
              >
                לחץ כאן לחיבור מסד נתונים משותף (Firebase)
              </button>
            </div>
          )}

          {/* Main Dashboard */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                  <p className="text-xs font-medium text-slate-500 mb-1">סה״כ פעילות</p>
                  <p className="text-2xl font-bold text-slate-900">{stats.totalActive}</p>
                </div>
                <div className="p-2.5 bg-blue-50 text-blue-600 rounded-lg"><IconLayers /></div>
              </div>

              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                  <p className="text-xs font-medium text-slate-500 mb-1">בתהליך עבודה</p>
                  <p className="text-2xl font-bold text-amber-600">{stats.pending}</p>
                </div>
                <div className="p-2.5 bg-amber-50 text-amber-600 rounded-lg"><IconClock /></div>
              </div>

              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                  <p className="text-xs font-medium text-slate-500 mb-1">אומתו ונסגרו</p>
                  <p className="text-2xl font-bold text-emerald-600">{stats.completed}</p>
                </div>
                <div className="p-2.5 bg-emerald-50 text-emerald-600 rounded-lg"><IconPackageCheck /></div>
              </div>

              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                  <p className="text-xs font-medium text-slate-500 mb-1">באוגדן ארכיון</p>
                  <p className="text-2xl font-bold text-slate-600">{stats.archivedCount}</p>
                </div>
                <div className="p-2.5 bg-slate-100 text-slate-600 rounded-lg"><IconArchive /></div>
              </div>
            </div>

            {/* Filter Bar */}
            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
              <div className="relative w-full md:w-96">
                <span className="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400"><IconSearch /></span>
                <input 
                  type="text"
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                  placeholder="חפש לפי שם פריט, מזמין, פרויקט..."
                  className="w-full pl-4 pr-10 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
                {searchTerm && (
                  <button onClick={() => setSearchTerm('')} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                    <IconX />
                  </button>
                )}
              </div>

              <div className="flex items-center gap-3 w-full md:w-auto justify-end">
                <span className="text-xs font-semibold text-slate-500">סינון פרויקט:</span>
                <select
                  value={selectedProjectFilter}
                  onChange={(e) => setSelectedProjectFilter(e.target.value)}
                  className="bg-slate-50 border border-slate-200 text-slate-700 text-sm font-medium rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                  <option value="ALL">כל הפרויקטים</option>
                  {existingProjects.map(p => <option key={p} value={p}>{p}</option>)}
                </select>
              </div>
            </div>

            {/* Table */}
            <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
              <div className="overflow-x-auto">
                <table className="w-full text-right border-collapse">
                  <thead>
                    <tr className="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs font-bold uppercase tracking-wider">
                      <th className="p-4 w-10 text-center">
                        <input 
                          type="checkbox"
                          checked={displayedOrders.length > 0 && displayedOrders.every(o => selectedIds.includes(o.id))}
                          onChange={toggleSelectAll}
                          className="w-4 h-4 text-blue-600 rounded border-slate-300 cursor-pointer"
                        />
                      </th>
                      <th className="p-4 cursor-pointer hover:bg-slate-100" onClick={() => handleSort('itemName')}>שם הפריט</th>
                      <th className="p-4 cursor-pointer hover:bg-slate-100" onClick={() => handleSort('requestedBy')}>מזמין</th>
                      <th className="p-4 cursor-pointer hover:bg-slate-100" onClick={() => handleSort('orderNumber')}>מספר הזמנה</th>
                      <th className="p-4 cursor-pointer hover:bg-slate-100" onClick={() => handleSort('quantity')}>כמות</th>
                      <th className="p-4 cursor-pointer hover:bg-slate-100" onClick={() => handleSort('project')}>פרויקט</th>
                      <th className="p-4">קישור</th>
                      <th className="p-4 cursor-pointer hover:bg-slate-100" onClick={() => handleSort('status')}>סטטוס</th>
                      <th className="p-4 cursor-pointer hover:bg-slate-100" onClick={() => handleSort('createdAt')}>תאריך</th>
                      <th className="p-4 text-center">פעולות</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 text-sm">
                    {displayedOrders.length === 0 ? (
                      <tr>
                        <td colSpan="10" className="p-12 text-center text-slate-400">לא נמצאו הזמנות מתאימות.</td>
                      </tr>
                    ) : (
                      displayedOrders.map(order => (
                        <tr key={order.id} className={`transition-colors ${selectedIds.includes(order.id) ? 'bg-blue-50/70' : 'hover:bg-slate-50'}`}>
                          <td className="p-4 text-center">
                            <input 
                              type="checkbox"
                              checked={selectedIds.includes(order.id)}
                              onChange={() => toggleSelectOrder(order.id)}
                              className="w-4 h-4 text-blue-600 rounded border-slate-300 cursor-pointer"
                            />
                          </td>
                          <td className="p-4 font-semibold text-slate-900">{order.itemName}</td>
                          <td className="p-4 text-slate-700 font-medium">{order.requestedBy || order.orderer || order.ordererName || '—'}</td>
                          <td className="p-4">
                            {order.orderNumber ? (
                              <span className="font-mono text-xs bg-slate-100 text-slate-800 px-2 py-1 rounded border border-slate-200">
                                {order.orderNumber}
                              </span>
                            ) : '—'}
                          </td>
                          <td className="p-4 font-bold">{order.quantity || 1} יח'</td>
                          <td className="p-4">
                            {order.project ? (
                              <span className="bg-blue-50 text-blue-700 px-2.5 py-1 rounded-md text-xs font-semibold">
                                {order.project}
                              </span>
                            ) : '—'}
                          </td>
                          <td className="p-4">
                            {order.url ? (
                              <div className="flex items-center gap-1.5">
                                <a 
                                  href={formatUrl(order.url)}
                                  target="_blank"
                                  rel="noopener noreferrer"
                                  className="inline-flex items-center gap-1 text-blue-600 hover:bg-blue-50 px-2 py-1 rounded border border-blue-200 text-xs"
                                >
                                  <IconExternalLink />
                                  <span>פתח</span>
                                </a>
                                <button 
                                  onClick={() => handleCopyLink(order.url, order.id)}
                                  className="inline-flex items-center gap-1 text-slate-600 hover:bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs"
                                >
                                  {copiedId === order.id ? <span className="text-emerald-600 font-bold">הועתק!</span> : <IconCopy />}
                                </button>
                              </div>
                            ) : '—'}
                          </td>
                          <td className="p-4">
                            <select 
                              value={order.status} 
                              onChange={(e) => handleStatusChange(order.id, e.target.value)}
                              className={`border text-xs font-bold px-3 py-1.5 rounded-full cursor-pointer ${STATUS_COLORS[order.status] || 'bg-slate-100'}`}
                            >
                              {STATUS_OPTIONS.map(st => <option key={st} value={st}>{st}</option>)}
                            </select>
                          </td>
                          <td className="p-4 text-xs text-slate-500 whitespace-nowrap">
                            {order.date ? new Date(order.date).toLocaleDateString('he-IL') : '—'}
                          </td>
                          <td className="p-4">
                            <div className="flex items-center justify-center gap-1">
                              <button 
                                onClick={() => { setTrackingModalOrder(order); setCurrentTrackingNumber(order.trackingNumber || ''); }} 
                                className={`p-1.5 rounded hover:bg-indigo-50 ${order.trackingNumber ? 'text-indigo-600' : 'text-slate-400'}`}
                                title="מספר מעקב"
                              >
                                <IconTruck />
                              </button>
                              <button 
                                onClick={() => { setNotesModalOrder(order); setCurrentNotes(order.notes || ''); }} 
                                className={`p-1.5 rounded hover:bg-amber-50 ${order.notes ? 'text-amber-600' : 'text-slate-400'}`}
                                title="הערות"
                              >
                                <IconMessageSquare />
                              </button>
                              <button 
                                onClick={() => handleOpenModal(order)} 
                                className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded"
                                title="ערוך"
                              >
                                <IconEdit />
                              </button>
                              <button 
                                onClick={() => toggleArchive(order.id, order.isArchived)} 
                                className="p-1.5 text-slate-400 hover:text-amber-600 hover:bg-amber-50 rounded"
                                title={order.isArchived ? 'שחזר' : 'העבר לארכיון'}
                              >
                                {order.isArchived ? <IconUndo /> : <IconArchive />}
                              </button>
                              <button
                                onClick={() => handleDeleteOrder(order)}
                                className="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded"
                                title="מחק הזמנה"
                              >
                                <IconTrash />
                              </button>
                            </div>
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </main>

          {/* Add / Edit Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden border border-slate-100">
                <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                  <h3 className="text-lg font-bold text-slate-900">{editingOrder ? 'עריכת הזמנה' : 'הוספת הזמנה חדשה'}</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-600"><IconX /></button>
                </div>
                <form onSubmit={handleSaveOrder} className="p-6 flex flex-col gap-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">שם הפריט *</label>
                    <input 
                      type="text" required value={formData.itemName} 
                      onChange={e => setFormData({...formData, itemName: e.target.value})}
                      className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">מזמין</label>
                    <input 
                      type="text"
                      list="req-list"
                      autoComplete="off"
                      value={formData.requestedBy} 
                      onChange={e => setFormData({...formData, requestedBy: e.target.value})}
                      placeholder="הקלד או בחר מזמין..."
                      className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                    {!editingOrder && currentDisplayName && (
                      <p className="text-xs text-slate-500 mt-1">מולא אוטומטית לפי המשתמש המחובר. אפשר לשנות אם מזמינים עבור עובד אחר.</p>
                    )}
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">מספר הזמנה</label>
                      <input 
                        type="text" value={formData.orderNumber} 
                        onChange={e => setFormData({...formData, orderNumber: e.target.value})}
                        className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">כמות *</label>
                      <input 
                        type="number" min="1" required value={formData.quantity} 
                        onChange={e => setFormData({...formData, quantity: parseInt(e.target.value) || 1})}
                        className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">פרויקט</label>
                      <input 
                        type="text"
                        list="proj-list"
                        autoComplete="off"
                        value={formData.project} 
                        onChange={e => setFormData({...formData, project: e.target.value})}
                        placeholder="הקלד או בחר פרויקט..."
                        className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">סטטוס</label>
                      <select 
                        value={formData.status} onChange={e => setFormData({...formData, status: e.target.value})}
                        className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                      >
                        {STATUS_OPTIONS.map(st => <option key={st} value={st}>{st}</option>)}
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">קישור להזמנה</label>
                    <input 
                      type="url" value={formData.url} onChange={e => setFormData({...formData, url: e.target.value})}
                      className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm text-left focus:outline-none focus:ring-2 focus:ring-blue-500" dir="ltr"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">הערות</label>
                    <textarea 
                      rows="3" value={formData.notes} onChange={e => setFormData({...formData, notes: e.target.value})}
                      className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
                    />
                  </div>
                  <div className="flex gap-3 mt-2">
                    <button type="submit" className="flex-1 bg-blue-600 text-white py-2.5 rounded-xl font-bold text-sm hover:bg-blue-700">שמור הזמנה</button>
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-5 py-2.5 border border-slate-300 text-slate-700 rounded-xl font-bold text-sm hover:bg-slate-50">ביטול</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Global Permanent Datalists */}
          <datalist id="proj-list">
            {existingProjects.map(p => <option key={p} value={p}>{p}</option>)}
          </datalist>

          <datalist id="req-list">
            {existingRequestedBy.map(r => <option key={r} value={r}>{r}</option>)}
          </datalist>

          {/* Notes Quick Modal */}
          {notesModalOrder && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-100">
