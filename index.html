<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מערכת מעקב הזמנות - סנכרון צוות</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // =========================================================================
    // 🔑 הגדרות FIREBASE - הדבק כאן את הפרטים מפרויקט Firebase שלך
    // (אם השדות ריקים, המערכת תפעל במצב מקומי ללא סנכרון בין משתמשים)
    // =========================================================================
    const DEFAULT_FIREBASE_CONFIG = {
  apiKey: "AIzaSyCjK4j3iTUHYk-s6cRnipA9Tk5gSZzgU_s",
  authDomain: "alpha-order-tracker.firebaseapp.com",
  projectId: "alpha-order-tracker",
  storageBucket: "alpha-order-tracker.firebasestorage.app",
  messagingSenderId: "506327002580",
  appId: "1:506327002580:web:3738dc79662bf57de1ba41"
};

    // Icons
    const IconPlus = () => <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    const IconArchive = () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>;
    const IconUndo = () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>;
    const IconEdit = () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>;
    const IconExternalLink = () => <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>;
    const IconSearch = () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
    const IconX = () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
    const IconCopy = () => <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>;
    const IconMessageSquare = () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>;
    const IconClipboardList = () => <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>;
    const IconPackageCheck = () => <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 16l2 2 4-4"/><path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l2-1.14"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" y1="22" x2="12" y2="12"/></svg>;
    const IconClock = () => <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
    const IconLayers = () => <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>;
    const IconTruck = () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>;
    const IconDownload = () => <svg className="w-4.5 h-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
    const IconCloud = () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.5 19x-9 0a7 7 0 1 1 3.22-13.041 5 5 0 0 1 9.13 4.253A4.5 4.5 0 0 1 17.5 19z"/></svg>;
    const IconCloudOff = () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M22.61 16.95A5 5 0 0 0 18 10h-1.26a8 8 0 0 0-7.05-6M5 5a8 8 0 0 0-4 7h.5A5 5 0 0 0 6 17h8"/></svg>;

    const STATUS_OPTIONS = [
      'ראשוני',
      'נשלחה לשגיא',
      'נשלחה למחלקת רכש',
      'אושרה ע"י אלירן',
      'הוזמנה',
      'התקבלה במחלקת רכש',
      'נמסרה',
      'אומתה ונסגרה'
    ];

    const STATUS_COLORS = {
      'ראשוני': 'bg-slate-100 text-slate-700 border-slate-300 hover:bg-slate-200',
      'נשלחה לשגיא': 'bg-amber-50 text-amber-700 border-amber-300 hover:bg-amber-100',
      'נשלחה למחלקת רכש': 'bg-orange-50 text-orange-700 border-orange-300 hover:bg-orange-100',
      'אושרה ע"י אלירן': 'bg-purple-50 text-purple-700 border-purple-300 hover:bg-purple-100',
      'הוזמנה': 'bg-blue-50 text-blue-700 border-blue-300 hover:bg-blue-100',
      'התקבלה במחלקת רכש': 'bg-indigo-50 text-indigo-700 border-indigo-300 hover:bg-indigo-100',
      'נמסרה': 'bg-teal-50 text-teal-700 border-teal-300 hover:bg-teal-100',
      'אומתה ונסגרה': 'bg-emerald-50 text-emerald-800 border-emerald-300 hover:bg-emerald-100'
    };

    const MOCK_ORDERS = [
      {
        id: 'ord-1',
        itemName: 'מחשב נייד Dell XPS 15',
        orderNumber: 'PO-2024-001',
        trackingNumber: '1Z9999999999999999',
        quantity: 2,
        project: 'שדרוג מעבדה',
        url: 'https://www.dell.com',
        status: 'אושרה ע"י אלירן',
        notes: 'מפרט i7, 32GB RAM, זיכרון 1TB SSD.',
        isArchived: false,
        date: new Date().toISOString(),
        createdAt: Date.now()
      },
      {
        id: 'ord-2',
        itemName: 'בקר לוגי מתוכנת Siemens S7-1200',
        orderNumber: 'PO-2024-002',
        trackingNumber: '',
        quantity: 5,
        project: 'פרויקט אוטומציה',
        url: 'https://www.siemens.com',
        status: 'הוזמנה',
        notes: 'ספק מתחייב לאספקה תוך 14 ימי עסקים.',
        isArchived: false,
        date: new Date(Date.now() - 86400000).toISOString(),
        createdAt: Date.now() - 86400000
      }
    ];

    function OrderTracker() {
      const [orders, setOrders] = useState([]);
      const [showArchive, setShowArchive] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedProjectFilter, setSelectedProjectFilter] = useState('ALL');
      const [sortConfig, setSortConfig] = useState({ key: 'createdAt', direction: 'desc' });
      const [copiedId, setCopiedId] = useState(null);
      const [selectedIds, setSelectedIds] = useState([]);
      
      // Cloud status
      const [dbInstance, setDbInstance] = useState(null);
      const [isCloudActive, setIsCloudActive] = useState(false);
      const [firebaseConfigModal, setFirebaseConfigModal] = useState(false);
      const [configInput, setConfigInput] = useState('');

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingOrder, setEditingOrder] = useState(null);
      
      const [notesModalOrder, setNotesModalOrder] = useState(null);
      const [currentNotes, setCurrentNotes] = useState('');

      const [trackingModalOrder, setTrackingModalOrder] = useState(null);
      const [currentTrackingNumber, setCurrentTrackingNumber] = useState('');

      const [formData, setFormData] = useState({
        itemName: '',
        orderNumber: '',
        trackingNumber: '',
        quantity: 1,
        project: '',
        url: '',
        status: STATUS_OPTIONS[0],
        notes: ''
      });

      // Initialize Firebase or LocalStorage
      useEffect(() => {
        let activeConfig = DEFAULT_FIREBASE_CONFIG;
        const savedConfig = localStorage.getItem('user_firebase_config');
        
        if (savedConfig) {
          try { activeConfig = JSON.parse(savedConfig); } catch(e) {}
        }

        const hasValidConfig = activeConfig && activeConfig.projectId && activeConfig.projectId.trim() !== '';

        if (hasValidConfig) {
          try {
            if (!firebase.apps.length) {
              firebase.initializeApp(activeConfig);
            }
            const db = firebase.firestore();
            setDbInstance(db);
            setIsCloudActive(true);

            // Listen to real-time changes
            const unsubscribe = db.collection('orders').onSnapshot(snapshot => {
              const cloudOrders = snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
              }));
              setOrders(cloudOrders);
            }, (err) => {
              console.error("Firestore error:", err);
              setIsCloudActive(false);
              loadLocalFallback();
            });

            return () => unsubscribe();
          } catch (e) {
            console.error("Firebase init failed:", e);
            setIsCloudActive(false);
            loadLocalFallback();
          }
        } else {
          setIsCloudActive(false);
          loadLocalFallback();
        }
      }, []);

      const loadLocalFallback = () => {
        const stored = localStorage.getItem('company_orders_data');
        if (stored) {
          try { setOrders(JSON.parse(stored)); } catch(e) { setOrders(MOCK_ORDERS); }
        } else {
          setOrders(MOCK_ORDERS);
        }
      };

      // Sync local storage as fallback
      useEffect(() => {
        if (!isCloudActive && orders.length > 0) {
          localStorage.setItem('company_orders_data', JSON.stringify(orders));
        }
      }, [orders, isCloudActive]);

      const handleSaveCloudConfig = () => {
        try {
          const parsed = JSON.parse(configInput);
          localStorage.setItem('user_firebase_config', JSON.stringify(parsed));
          window.location.reload();
        } catch(e) {
          alert('הקוד שאתה מחזיק אינו JSON תקין. אנא העתק את ה-firebaseConfig במלואו.');
        }
      };

      const existingProjects = useMemo(() => {
        const setP = new Set();
        orders.forEach(o => {
          if (o.project && o.project.trim()) setP.add(o.project.trim());
        });
        return Array.from(setP);
      }, [orders]);

      const stats = useMemo(() => {
        const active = orders.filter(o => !o.isArchived);
        const archived = orders.filter(o => o.isArchived);
        const completed = active.filter(o => o.status === 'אומתה ונסגרה').length;
        const pending = active.length - completed;
        return { totalActive: active.length, pending, completed, archivedCount: archived.length };
      }, [orders]);

      const handleSort = (key) => {
        setSortConfig(prev => {
          if (prev.key === key) {
            return { key, direction: prev.direction === 'asc' ? 'desc' : 'asc' };
          }
          return { key, direction: 'asc' };
        });
      };

      const handleOpenModal = (order = null) => {
        if (order) {
          setEditingOrder(order);
          setFormData({
            itemName: order.itemName || '',
            orderNumber: order.orderNumber || '',
            trackingNumber: order.trackingNumber || '',
            quantity: order.quantity || 1,
            project: order.project || '',
            url: order.url || '',
            status: order.status || STATUS_OPTIONS[0],
            notes: order.notes || ''
          });
        } else {
          setEditingOrder(null);
          setFormData({
            itemName: '',
            orderNumber: '',
            trackingNumber: '',
            quantity: 1,
            project: '',
            url: '',
            status: STATUS_OPTIONS[0],
            notes: ''
          });
        }
        setIsModalOpen(true);
      };

      const handleSaveOrder = async (e) => {
        e.preventDefault();
        if (!formData.itemName.trim()) return;

        const payload = {
          itemName: formData.itemName.trim(),
          orderNumber: formData.orderNumber.trim(),
          trackingNumber: formData.trackingNumber.trim(),
          quantity: Number(formData.quantity) || 1,
          project: formData.project.trim(),
          url: formData.url.trim(),
          status: formData.status,
          notes: formData.notes.trim(),
          isArchived: editingOrder ? Boolean(editingOrder.isArchived) : false,
          date: editingOrder ? editingOrder.date : new Date().toISOString(),
          createdAt: editingOrder ? (editingOrder.createdAt || Date.now()) : Date.now()
        };

        if (isCloudActive && dbInstance) {
          if (editingOrder) {
            await dbInstance.collection('orders').doc(editingOrder.id).update(payload);
          } else {
            await dbInstance.collection('orders').add(payload);
          }
        } else {
          if (editingOrder) {
            setOrders(prev => prev.map(o => o.id === editingOrder.id ? { ...o, ...payload } : o));
          } else {
            const newOrder = { id: 'ord-' + Date.now(), ...payload };
            setOrders(prev => [newOrder, ...prev]);
          }
        }

        setIsModalOpen(false);
      };

      const handleStatusChange = async (orderId, newStatus) => {
        if (isCloudActive && dbInstance) {
          await dbInstance.collection('orders').doc(orderId).update({ status: newStatus });
        } else {
          setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: newStatus } : o));
        }
      };

      const toggleArchive = async (orderId, currentArchivedState) => {
        const nextState = !currentArchivedState;
        if (isCloudActive && dbInstance) {
          await dbInstance.collection('orders').doc(orderId).update({ isArchived: nextState });
        } else {
          setOrders(prev => prev.map(o => o.id === orderId ? { ...o, isArchived: nextState } : o));
        }
      };

      const handleSaveNotes = async () => {
        if (!notesModalOrder) return;
        const updatedNotes = currentNotes.trim();

        if (isCloudActive && dbInstance) {
          await dbInstance.collection('orders').doc(notesModalOrder.id).update({ notes: updatedNotes });
        } else {
          setOrders(prev => prev.map(o => o.id === notesModalOrder.id ? { ...o, notes: updatedNotes } : o));
        }
        setNotesModalOrder(null);
      };

      const handleSaveTracking = async () => {
        if (!trackingModalOrder) return;
        const updatedTracking = currentTrackingNumber.trim();

        if (isCloudActive && dbInstance) {
          await dbInstance.collection('orders').doc(trackingModalOrder.id).update({ trackingNumber: updatedTracking });
        } else {
          setOrders(prev => prev.map(o => o.id === trackingModalOrder.id ? { ...o, trackingNumber: updatedTracking } : o));
        }
        setTrackingModalOrder(null);
      };

      const formatUrl = (url) => {
        if (!url) return '';
        let trimmed = url.trim();
        return /^https?:\/\//i.test(trimmed) ? trimmed : 'https://' + trimmed;
      };

      const handleCopyLink = (rawUrl, id) => {
        if (!rawUrl) return;
        const formatted = formatUrl(rawUrl);
        navigator.clipboard.writeText(formatted).catch(() => {});
        setCopiedId(id);
        setTimeout(() => setCopiedId(null), 2000);
      };

      const toggleSelectOrder = (id) => {
        setSelectedIds(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
      };

      const toggleSelectAll = () => {
        const displayed = displayedOrders.map(o => o.id);
        const allSelected = displayed.length > 0 && displayed.every(id => selectedIds.includes(id));
        setSelectedIds(allSelected ? prev => prev.filter(id => !displayed.includes(id)) : prev => Array.from(new Set([...prev, ...displayed])));
      };

      const handleExportExcel = () => {
        const toExport = selectedIds.length > 0 ? orders.filter(o => selectedIds.includes(o.id)) : displayedOrders;
        if (toExport.length === 0) return;

        const headers = ['שם הפריט', 'מספר הזמנה', 'כמות', 'פרויקט', 'סטטוס', 'מספר מעקב', 'קישור', 'הערות', 'תאריך'];
        const rows = toExport.map(o => [
          `"${(o.itemName || '').replace(/"/g, '""')}"`,
          `"${(o.orderNumber || '').replace(/"/g, '""')}"`,
          `"${o.quantity || 1}"`,
          `"${(o.project || '').replace(/"/g, '""')}"`,
          `"${(o.status || '').replace(/"/g, '""')}"`,
          `"${(o.trackingNumber || '').replace(/"/g, '""')}"`,
          `"${(o.url || '').replace(/"/g, '""')}"`,
          `"${(o.notes || '').replace(/"/g, '""')}"`,
          `"${o.date ? new Date(o.date).toLocaleDateString('he-IL') : ''}"`
        ]);

        const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `דוח_הזמנות_${new Date().toISOString().slice(0, 10)}.csv`;
        link.click();
        URL.revokeObjectURL(url);
      };

      const displayedOrders = useMemo(() => {
        return orders
          .filter(o => Boolean(o.isArchived) === showArchive)
          .filter(o => {
            const matchSearch = 
              (o.itemName || '').toLowerCase().includes(searchTerm.toLowerCase()) || 
              (o.orderNumber || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
              (o.project || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
              (o.notes || '').toLowerCase().includes(searchTerm.toLowerCase());
            const matchProject = selectedProjectFilter === 'ALL' || o.project === selectedProjectFilter;
            return matchSearch && matchProject;
          })
          .sort((a, b) => {
            if (sortConfig.key === 'createdAt') {
              const timeA = a.createdAt || 0;
              const timeB = b.createdAt || 0;
              return sortConfig.direction === 'asc' ? timeA - timeB : timeB - timeA;
            }
            if (sortConfig.key === 'quantity') {
              return sortConfig.direction === 'asc' ? (a.quantity || 1) - (b.quantity || 1) : (b.quantity || 1) - (a.quantity || 1);
            }
            const valA = (a[sortConfig.key] || '').toString().toLowerCase();
            const valB = (b[sortConfig.key] || '').toString().toLowerCase();
            return sortConfig.direction === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
          });
      }, [orders, showArchive, searchTerm, selectedProjectFilter, sortConfig]);

      return (
        <div className="min-h-screen bg-slate-50 font-sans text-slate-800 pb-12" dir="rtl">
          {/* Header */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
              <div className="flex items-center gap-3">
                <div className="bg-blue-600 p-2.5 rounded-xl text-white shadow-md shadow-blue-500/20">
                  <IconClipboardList />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-xl sm:text-2xl font-bold text-slate-900">מערכת מעקב הזמנות</h1>
                    <button 
                      onClick={() => setFirebaseConfigModal(true)}
                      className={`inline-flex items-center gap-1 text-xs px-2.5 py-1 rounded-full font-bold transition-all ${
                        isCloudActive 
                          ? 'bg-emerald-100 text-emerald-800 hover:bg-emerald-200' 
                          : 'bg-amber-100 text-amber-800 hover:bg-amber-200'
                      }`}
                      title="לחץ להגדרת חיבור הענן"
                    >
                      {isCloudActive ? <IconCloud /> : <IconCloudOff />}
                      <span>{isCloudActive ? 'מחובר לסנכרון ענן' : 'מצב מקומי בלבד (לחץ לחיבור)'}</span>
                    </button>
                  </div>
                  <p className="text-xs sm:text-sm text-slate-500">ניהול דרישות, אישורים וסטטוס רכש בזמן אמת</p>
                </div>
              </div>

              <div className="flex items-center gap-3 flex-wrap justify-end">
                <button
                  onClick={handleExportExcel}
                  className="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-md transition-all active:scale-95"
                >
                  <IconDownload />
                  <span>{selectedIds.length > 0 ? `ייצא מסומנים (${selectedIds.length})` : 'ייצא לאקסל'}</span>
                </button>

                <button
                  onClick={() => setShowArchive(!showArchive)}
                  className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold border transition-all ${
                    showArchive ? 'bg-amber-50 text-amber-700 border-amber-300 hover:bg-amber-100' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'
                  }`}
                >
                  <IconArchive />
                  <span>{showArchive ? 'חזור להזמנות פעילות' : 'ארכיון הזמנות'}</span>
                  {stats.archivedCount > 0 && (
                    <span className="bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full text-xs font-bold">{stats.archivedCount}</span>
                  )}
                </button>

                <button
                  onClick={() => handleOpenModal()}
                  className="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-md transition-all active:scale-95"
                >
                  <IconPlus />
                  <span>הזמנה חדשה</span>
                </button>
              </div>
            </div>
          </header>

          {/* Cloud Sync Warning Banner */}
          {!isCloudActive && (
            <div className="bg-amber-500 text-white px-4 py-2.5 text-center text-xs sm:text-sm font-medium flex items-center justify-center gap-2 shadow-inner">
              <span>⚠️ <strong>שים לב:</strong> המערכת פועלת כרגע במצב זיכרון מקומי. שינויים שתבצע יישמרו רק במחשב זה.</span>
              <button 
                onClick={() => setFirebaseConfigModal(true)}
                className="underline font-bold hover:text-amber-100 bg-black/10 px-2 py-0.5 rounded"
              >
                לחץ כאן לחיבור מסד נתונים משותף (Firebase)
              </button>
            </div>
          )}

          {/* Main Dashboard */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                  <p className="text-xs font-medium text-slate-500 mb-1">סה״כ פעילות</p>
                  <p className="text-2xl font-bold text-slate-900">{stats.totalActive}</p>
                </div>
                <div className="p-2.5 bg-blue-50 text-blue-600 rounded-lg"><IconLayers /></div>
              </div>

              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                  <p className="text-xs font-medium text-slate-500 mb-1">בתהליך עבודה</p>
                  <p className="text-2xl font-bold text-amber-600">{stats.pending}</p>
                </div>
                <div className="p-2.5 bg-amber-50 text-amber-600 rounded-lg"><IconClock /></div>
              </div>

              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                  <p className="text-xs font-medium text-slate-500 mb-1">אומתו ונסגרו</p>
                  <p className="text-2xl font-bold text-emerald-600">{stats.completed}</p>
                </div>
                <div className="p-2.5 bg-emerald-50 text-emerald-600 rounded-lg"><IconPackageCheck /></div>
              </div>

              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                  <p className="text-xs font-medium text-slate-500 mb-1">באוגדן ארכיון</p>
                  <p className="text-2xl font-bold text-slate-600">{stats.archivedCount}</p>
                </div>
                <div className="p-2.5 bg-slate-100 text-slate-600 rounded-lg"><IconArchive /></div>
              </div>
            </div>

            {/* Filter Bar */}
            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
              <div className="relative w-full md:w-96">
                <span className="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400"><IconSearch /></span>
                <input 
                  type="text"
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                  placeholder="חפש לפי שם פריט, פרויקט או הערות..."
                  className="w-full pl-4 pr-10 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
                {searchTerm && (
                  <button onClick={() => setSearchTerm('')} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                    <IconX />
                  </button>
                )}
              </div>

              <div className="flex items-center gap-3 w-full md:w-auto justify-end">
                <span className="text-xs font-semibold text-slate-500">סינון פרויקט:</span>
                <select
                  value={selectedProjectFilter}
                  onChange={(e) => setSelectedProjectFilter(e.target.value)}
                  className="bg-slate-50 border border-slate-200 text-slate-700 text-sm font-medium rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                  <option value="ALL">כל הפרויקטים</option>
                  {existingProjects.map(p => <option key={p} value={p}>{p}</option>)}
                </select>
              </div>
            </div>

            {/* Table */}
            <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
              <div className="overflow-x-auto">
                <table className="w-full text-right border-collapse">
                  <thead>
                    <tr className="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs font-bold uppercase tracking-wider">
                      <th className="p-4 w-10 text-center">
                        <input 
                          type="checkbox"
                          checked={displayedOrders.length > 0 && displayedOrders.every(o => selectedIds.includes(o.id))}
                          onChange={toggleSelectAll}
                          className="w-4 h-4 text-blue-600 rounded border-slate-300 cursor-pointer"
                        />
                      </th>
                      <th className="p-4 cursor-pointer hover:bg-slate-100" onClick={() => handleSort('itemName')}>שם הפריט</th>
                      <th className="p-4 cursor-pointer hover:bg-slate-100" onClick={() => handleSort('orderNumber')}>מספר הזמנה</th>
                      <th className="p-4 cursor-pointer hover:bg-slate-100" onClick={() => handleSort('quantity')}>כמות</th>
                      <th className="p-4 cursor-pointer hover:bg-slate-100" onClick={() => handleSort('project')}>פרויקט</th>
                      <th className="p-4">קישור</th>
                      <th className="p-4 cursor-pointer hover:bg-slate-100" onClick={() => handleSort('status')}>סטטוס</th>
                      <th className="p-4 cursor-pointer hover:bg-slate-100" onClick={() => handleSort('createdAt')}>תאריך</th>
                      <th className="p-4 text-center">פעולות</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 text-sm">
                    {displayedOrders.length === 0 ? (
                      <tr>
                        <td colSpan="9" className="p-12 text-center text-slate-400">לא נמצאו הזמנות מתאימות.</td>
                      </tr>
                    ) : (
                      displayedOrders.map(order => (
                        <tr key={order.id} className={`transition-colors ${selectedIds.includes(order.id) ? 'bg-blue-50/70' : 'hover:bg-slate-50'}`}>
                          <td className="p-4 text-center">
                            <input 
                              type="checkbox"
                              checked={selectedIds.includes(order.id)}
                              onChange={() => toggleSelectOrder(order.id)}
                              className="w-4 h-4 text-blue-600 rounded border-slate-300 cursor-pointer"
                            />
                          </td>
                          <td className="p-4 font-semibold text-slate-900">{order.itemName}</td>
                          <td className="p-4">
                            {order.orderNumber ? (
                              <span className="font-mono text-xs bg-slate-100 text-slate-800 px-2 py-1 rounded border border-slate-200">
                                {order.orderNumber}
                              </span>
                            ) : '—'}
                          </td>
                          <td className="p-4 font-bold">{order.quantity || 1} יח'</td>
                          <td className="p-4">
                            {order.project ? (
                              <span className="bg-blue-50 text-blue-700 px-2.5 py-1 rounded-md text-xs font-semibold">
                                {order.project}
                              </span>
                            ) : '—'}
                          </td>
                          <td className="p-4">
                            {order.url ? (
                              <div className="flex items-center gap-1.5">
                                <a 
                                  href={formatUrl(order.url)}
                                  target="_blank"
                                  rel="noopener noreferrer"
                                  className="inline-flex items-center gap-1 text-blue-600 hover:bg-blue-50 px-2 py-1 rounded border border-blue-200 text-xs"
                                >
                                  <IconExternalLink />
                                  <span>פתח</span>
                                </a>
                                <button 
                                  onClick={() => handleCopyLink(order.url, order.id)}
                                  className="inline-flex items-center gap-1 text-slate-600 hover:bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs"
                                >
                                  {copiedId === order.id ? <span className="text-emerald-600 font-bold">הועתק!</span> : <IconCopy />}
                                </button>
                              </div>
                            ) : '—'}
                          </td>
                          <td className="p-4">
                            <select 
                              value={order.status} 
                              onChange={(e) => handleStatusChange(order.id, e.target.value)}
                              className={`border text-xs font-bold px-3 py-1.5 rounded-full cursor-pointer ${STATUS_COLORS[order.status] || 'bg-slate-100'}`}
                            >
                              {STATUS_OPTIONS.map(st => <option key={st} value={st}>{st}</option>)}
                            </select>
                          </td>
                          <td className="p-4 text-xs text-slate-500 whitespace-nowrap">
                            {order.date ? new Date(order.date).toLocaleDateString('he-IL') : '—'}
                          </td>
                          <td className="p-4">
                            <div className="flex items-center justify-center gap-1">
                              <button 
                                onClick={() => { setTrackingModalOrder(order); setCurrentTrackingNumber(order.trackingNumber || ''); }} 
                                className={`p-1.5 rounded hover:bg-indigo-50 ${order.trackingNumber ? 'text-indigo-600' : 'text-slate-400'}`}
                                title="מספר מעקב"
                              >
                                <IconTruck />
                              </button>
                              <button 
                                onClick={() => { setNotesModalOrder(order); setCurrentNotes(order.notes || ''); }} 
                                className={`p-1.5 rounded hover:bg-amber-50 ${order.notes ? 'text-amber-600' : 'text-slate-400'}`}
                                title="הערות"
                              >
                                <IconMessageSquare />
                              </button>
                              <button 
                                onClick={() => handleOpenModal(order)} 
                                className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded"
                                title="ערוך"
                              >
                                <IconEdit />
                              </button>
                              <button 
                                onClick={() => toggleArchive(order.id, order.isArchived)} 
                                className="p-1.5 text-slate-400 hover:text-amber-600 hover:bg-amber-50 rounded"
                                title={order.isArchived ? 'שחזר' : 'העבר לארכיון'}
                              >
                                {order.isArchived ? <IconUndo /> : <IconArchive />}
                              </button>
                            </div>
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </main>

          {/* Add / Edit Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden border border-slate-100">
                <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                  <h3 className="text-lg font-bold text-slate-900">{editingOrder ? 'עריכת הזמנה' : 'הוספת הזמנה חדשה'}</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-600"><IconX /></button>
                </div>
                <form onSubmit={handleSaveOrder} className="p-6 flex flex-col gap-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">שם הפריט *</label>
                    <input 
                      type="text" required value={formData.itemName} 
                      onChange={e => setFormData({...formData, itemName: e.target.value})}
                      className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">מספר הזמנה</label>
                      <input 
                        type="text" value={formData.orderNumber} 
                        onChange={e => setFormData({...formData, orderNumber: e.target.value})}
                        className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">כמות *</label>
                      <input 
                        type="number" min="1" required value={formData.quantity} 
                        onChange={e => setFormData({...formData, quantity: parseInt(e.target.value) || 1})}
                        className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">פרויקט</label>
                      <input 
                        type="text" list="proj-list" value={formData.project} 
                        onChange={e => setFormData({...formData, project: e.target.value})}
                        className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                      />
                      <datalist id="proj-list">
                        {existingProjects.map(p => <option key={p} value={p} />)}
                      </datalist>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">סטטוס</label>
                      <select 
                        value={formData.status} onChange={e => setFormData({...formData, status: e.target.value})}
                        className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                      >
                        {STATUS_OPTIONS.map(st => <option key={st} value={st}>{st}</option>)}
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">קישור להזמנה</label>
                    <input 
                      type="url" value={formData.url} onChange={e => setFormData({...formData, url: e.target.value})}
                      className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm text-left focus:outline-none focus:ring-2 focus:ring-blue-500" dir="ltr"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">הערות</label>
                    <textarea 
                      rows="3" value={formData.notes} onChange={e => setFormData({...formData, notes: e.target.value})}
                      className="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
                    />
                  </div>
                  <div className="flex gap-3 mt-2">
                    <button type="submit" className="flex-1 bg-blue-600 text-white py-2.5 rounded-xl font-bold text-sm hover:bg-blue-700">שמור הזמנה</button>
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-5 py-2.5 border border-slate-300 text-slate-700 rounded-xl font-bold text-sm hover:bg-slate-50">ביטול</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Notes Quick Modal */}
          {notesModalOrder && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-100">
                <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                  <h3 className="text-base font-bold text-slate-800">הערות: {notesModalOrder.itemName}</h3>
                  <button onClick={() => setNotesModalOrder(null)} className="text-slate-400 hover:text-slate-600"><IconX /></button>
                </div>
                <div className="p-6 flex flex-col gap-4">
                  <textarea 
                    rows="4" value={currentNotes} onChange={e => setCurrentNotes(e.target.value)}
                    className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
                    placeholder="הוסף הערה..."
                  />
                  <div className="flex gap-3">
                    <button onClick={handleSaveNotes} className="flex-1 bg-blue-600 text-white py-2.5 rounded-xl font-bold text-sm hover:bg-blue-700">שמור הערה</button>
                    <button onClick={() => setNotesModalOrder(null)} className="px-4 py-2.5 border border-slate-300 text-slate-700 rounded-xl font-bold text-sm hover:bg-slate-50">סגור</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Tracking Quick Modal */}
          {trackingModalOrder && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-100">
                <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                  <h3 className="text-base font-bold text-slate-800">מספר מעקב: {trackingModalOrder.itemName}</h3>
                  <button onClick={() => setTrackingModalOrder(null)} className="text-slate-400 hover:text-slate-600"><IconX /></button>
                </div>
                <div className="p-6 flex flex-col gap-4">
                  <input 
                    type="text" value={currentTrackingNumber} onChange={e => setCurrentTrackingNumber(e.target.value)}
                    className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500" dir="ltr"
                    placeholder="הכנס מספר מעקב..."
                  />
                  <div className="flex gap-3">
                    <button onClick={handleSaveTracking} className="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl font-bold text-sm hover:bg-indigo-700">שמור מספר מעקב</button>
                    <button onClick={() => setTrackingModalOrder(null)} className="px-4 py-2.5 border border-slate-300 text-slate-700 rounded-xl font-bold text-sm hover:bg-slate-50">ביטול</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Firebase Config Modal */}
          {firebaseConfigModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden border border-slate-100">
                <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                  <h3 className="text-base font-bold text-slate-900">הגדרת מסד נתונים בענן (Firebase)</h3>
                  <button onClick={() => setFirebaseConfigModal(false)} className="text-slate-400 hover:text-slate-600"><IconX /></button>
                </div>
                <div className="p-6 flex flex-col gap-4">
                  <p className="text-xs text-slate-600">
                    כדי לסנכרן את ההזמנות בין כל המשתמשים בזמן אמת, הדבק כאן את אובייקט ה-<strong>firebaseConfig</strong> שקיבלת מ-Firebase Console (בפורמט JSON):
                  </p>
                  <textarea 
                    rows="7"
                    value={configInput}
                    onChange={(e) => setConfigInput(e.target.value)}
                    placeholder={`{\n  "apiKey": "AIzaSy...",\n  "authDomain": "myproject.firebaseapp.com",\n  "projectId": "myproject",\n  "storageBucket": "myproject.appspot.com",\n  "messagingSenderId": "...",\n  "appId": "..."\n}`}
                    className="w-full px-3.5 py-2.5 bg-slate-900 text-emerald-400 font-mono text-xs rounded-xl focus:outline-none resize-none"
                    dir="ltr"
                  />
                  <div className="flex gap-3">
                    <button onClick={handleSaveCloudConfig} className="flex-1 bg-emerald-600 text-white py-2.5 rounded-xl font-bold text-sm hover:bg-emerald-700">שמור והתחבר לענן</button>
                    <button onClick={() => setFirebaseConfigModal(false)} className="px-4 py-2.5 border border-slate-300 text-slate-700 rounded-xl font-bold text-sm hover:bg-slate-50">ביטול</button>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<OrderTracker />);
  </script>
</body>
</html>
